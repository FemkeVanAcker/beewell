# Runs the tests on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python + dependencies (exactly as in uv.lock)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
